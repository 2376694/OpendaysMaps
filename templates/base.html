<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Page{% endblock %}</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #fffbea; 
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            color: #333333;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #444444;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555555;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            background-color: #f9f9f9;
            color: #333333;
            font-size: 16px;
        }

        input[type="submit"], button {
            width: 100%;
            padding: 12px;
            background-color: #003A70; 
            color: #FFD100; 
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        input[type="submit"]:hover, button:hover {
            background-color: #FFD100; 
            color: #003A70; 
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #003A70;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .welcome-title {
            font-size: 36px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 15px;
        }

        .welcome-subtitle {
            font-size: 20px;
            color: #666666;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
